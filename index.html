<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Football Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section id="menu" class="menu">
      <h1>2D Football Arena</h1>
      <p>Escolha as seleções e o modo de jogo.</p>

      <div class="setup">
        <div class="setup-card">
          <h2>Player 1</h2>
          <label for="p1Shirt">Seleção</label>
          <select id="p1Shirt"><option value="brasil">🇧🇷 Brasil</option>
            <option value="argentina">🇦🇷 Argentina</option>
            <option value="franca">🇫🇷 França</option>
            <option value="alemanha">🇩🇪 Alemanha</option>
            <option value="espanha">🇪🇸 Espanha</option>
            <option value="portugal">🇵🇹 Portugal</option>
            <option value="italia">🇮🇹 Itália</option>
            <option value="inglaterra">🏴 Inglaterra</option>
            <option value="holanda">🇳🇱 Países Baixos</option>
            <option value="belgica">🇧🇪 Bélgica</option>
            <option value="croacia">🇭🇷 Croácia</option>
            <option value="uruguai">🇺🇾 Uruguai</option>
            <option value="colombia">🇨🇴 Colômbia</option>
            <option value="mexico">🇲🇽 México</option>
            <option value="eua">🇺🇸 Estados Unidos</option>
            <option value="japao">🇯🇵 Japão</option>
            <option value="coreia">🇰🇷 Coreia do Sul</option>
            <option value="marrocos">🇲🇦 Marrocos</option>
            <option value="senegal">🇸🇳 Senegal</option>
            <option value="nigeria">🇳🇬 Nigéria</option>
            <option value="camaroes">🇨🇲 Camarões</option>
            <option value="chile">🇨🇱 Chile</option>
            <option value="peru">🇵🇪 Peru</option>
            <option value="ecuador">🇪🇨 Equador</option>
            <option value="canada">🇨🇦 Canadá</option>
            <option value="australia">🇦🇺 Austrália</option>
            <option value="dinamarca">🇩🇰 Dinamarca</option>
            <option value="suecia">🇸🇪 Suécia</option>
            <option value="noruega">🇳🇴 Noruega</option>
            <option value="polonia">🇵🇱 Polônia</option>
            <option value="servia">🇷🇸 Sérvia</option>
            <option value="turquia">🇹🇷 Turquia</option>
            <option value="suica">🇨🇭 Suíça</option>
            <option value="estados_arabes">🇸🇦 Arábia Saudita</option></select>
          <p>Movimento: <b>W A S D</b></p>
          <p>Chute: <b>Espaço</b></p>
        </div>

        <div class="setup-card">
          <h2>Player 2</h2>
          <label for="p2Shirt">Seleção</label>
          <select id="p2Shirt"><option value="brasil">🇧🇷 Brasil</option>
            <option value="argentina">🇦🇷 Argentina</option>
            <option value="franca">🇫🇷 França</option>
            <option value="alemanha">🇩🇪 Alemanha</option>
            <option value="espanha">🇪🇸 Espanha</option>
            <option value="portugal">🇵🇹 Portugal</option>
            <option value="italia">🇮🇹 Itália</option>
            <option value="inglaterra">🏴 Inglaterra</option>
            <option value="holanda">🇳🇱 Países Baixos</option>
            <option value="belgica">🇧🇪 Bélgica</option>
            <option value="croacia">🇭🇷 Croácia</option>
            <option value="uruguai">🇺🇾 Uruguai</option>
            <option value="colombia">🇨🇴 Colômbia</option>
            <option value="mexico">🇲🇽 México</option>
            <option value="eua">🇺🇸 Estados Unidos</option>
            <option value="japao">🇯🇵 Japão</option>
            <option value="coreia">🇰🇷 Coreia do Sul</option>
            <option value="marrocos">🇲🇦 Marrocos</option>
            <option value="senegal">🇸🇳 Senegal</option>
            <option value="nigeria">🇳🇬 Nigéria</option>
            <option value="camaroes">🇨🇲 Camarões</option>
            <option value="chile">🇨🇱 Chile</option>
            <option value="peru">🇵🇪 Peru</option>
            <option value="ecuador">🇪🇨 Equador</option>
            <option value="canada">🇨🇦 Canadá</option>
            <option value="australia">🇦🇺 Austrália</option>
            <option value="dinamarca">🇩🇰 Dinamarca</option>
            <option value="suecia">🇸🇪 Suécia</option>
            <option value="noruega">🇳🇴 Noruega</option>
            <option value="polonia">🇵🇱 Polônia</option>
            <option value="servia">🇷🇸 Sérvia</option>
            <option value="turquia">🇹🇷 Turquia</option>
            <option value="suica">🇨🇭 Suíça</option>
            <option value="estados_arabes">🇸🇦 Arábia Saudita</option></select>
          <p>Movimento: <b>Setas</b></p>
          <p>Chute: <b>P</b></p>
        </div>
      </div>

      <div class="mode">
        <button id="onePlayer" class="primary">1 PLAYER</button>
        <button id="twoPlayer">2 PLAYERS</button>
      </div>
    </section>

    <main id="gameScreen" class="hidden">
      <header class="topbar">
        <div>
          <h1>2D Football Arena</h1>
          <p id="modeText">1 PLAYER</p>
        </div>
        <div class="score">
          <span id="blueScore">0</span>
          <b>×</b>
          <span id="redScore">0</span>
        </div>
      </header>

      <section class="game-wrap">
        <canvas id="game" width="1100" height="600"></canvas>
        <div id="message" class="message">GO!</div>
      </section>

      <section class="controls">
        <div><strong>P1</strong><span>WASD + Espaço</span></div>
        <div><strong>P2</strong><span>Setas + P</span></div>
        <div><strong>Menu / Pausa</strong><span>0</span></div>
        <div><strong>Menu</strong><span>Esc</span></div>
      </section>

      <button id="restart" type="button">Reiniciar partida</button>
      <button id="backMenu" class="secondary" type="button">Voltar ao menu</button>
    </main>
  </main>
  <script src="game.js"></script>
</body>
</html>
